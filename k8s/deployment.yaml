apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartpark-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartpark-api
  template:
    metadata:
      labels:
        app: smartpark-api
    spec:
      volumes:
        - name: model-data
          emptyDir: {}
        - name: carparks-config
          configMap:
            name: smartpark-carparks
      initContainers:
        - name: download-model
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
          env:
            - name: MODEL_URI
              valueFrom:
                configMapKeyRef:
                  name: smartpark-model-config
                  key: MODEL_URI
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              gsutil cp "${MODEL_URI}" /data/model.pt;
              test -s /data/model.pt
          volumeMounts:
            - name: model-data
              mountPath: /data
      containers:
        - name: smartpark-api
          image: australia-southeast2-docker.pkg.dev/project-ff562683-42b2-45ca-9de/fit3184/smartpark-api:v4.2
          env:
            - name: MODEL_PATH
              value: /data/model.pt
            - name: CARPARKS_CONFIG
              value: /app/config/carparks.json
            - name: USER_ACTIVITY_STORE
              value: redis
            - name: REDIS_URL
              value: redis://redis-service:6379/0
            - name: FIRESTORE_ENABLED
              value: "1"
            - name: FIRESTORE_DATABASE
              value: "fit3184-a1"
            - name: INFERENCE_WORKERS
              value: "2"
            - name: REQUEST_CACHE_TTL
              value: "30"
            - name: REQUEST_CACHE_REFRESH_AFTER
              value: "20"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: model-data
              mountPath: /data
              readOnly: true
            - name: carparks-config
              mountPath: /app/config/carparks.json
              subPath: carparks.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi